<!doctype html>
<html>
  <head>
    <title>frostko</title>
    <link rel="stylesheet" href="css/test.css" />
  </head>

  <body data-page="index">
    <header>
      <a>
        <img
          src="https://i.ibb.co/YF3tf1Xn/logo-removebg-preview.png"
          alt="Frostko logo"
          loading="lazy"
        />
      </a>
    </header>

    <div class="container">
      <section class="avatar">
        <img
          src="https://raw.githubusercontent.com/any2cards/worldhaven/refs/heads/master/images/art/frosthaven/characters/images/fh-drifter.png"
          alt="drifter"
          loading="lazy"
          width="331"
          height="453.5"
        />
      </section>

      <section>
        <div class="role">
          <label>
            <select name="role" required>
              <option value="index.html">Vin Diesel</option>
              <option value="krab.html">Surimi Jones</option>
              <option value="meteor.html">Blaze Chilli&Lime</option>
              <option value="stin.html">Slim Shady</option>
            </select>
          </label>
        </div>

        <table>
          <tr>
            <td>Level</td>
            <td data-id="xp-1">1</td>
            <td data-id="xp-2">2</td>
            <td data-id="xp-3">3</td>
            <td data-id="xp-4">4</td>
            <td data-id="xp-5">5</td>
            <td data-id="xp-6">6</td>
            <td data-id="xp-7">7</td>
            <td data-id="xp-8">8</td>
            <td data-id="xp-9">9</td>
          </tr>
          <tr>
            <td>XP</td>
            <td>0</td>
            <td>45</td>
            <td>95</td>
            <td>150</td>
            <td>210</td>
            <td>275</td>
            <td>345</td>
            <td>420</td>
            <td>500</td>
          </tr>
        </table>

        <div class="xpgold">
          <label>
            <img
              src="https://raw.githubusercontent.com/any2cards/worldhaven/refs/heads/master/images/art/frosthaven/icons/general/fh-xp-bw-icon.png"
              alt="Drifter"
              loading="lazy"
            />
            <input type="text" name="XP" placeholder="XP" class="short-input" />
          </label>

          <label>
            <img
              src="https://raw.githubusercontent.com/any2cards/worldhaven/refs/heads/master/images/art/frosthaven/icons/general/fh-money-bw-icon.png"
              alt="Drifter"
              loading="lazy"
            />
            <input type="text" name="$" placeholder="$" class="short-input" />
          </label>
        </div>

        <div class="surky">
          <label>
            <img
              src="https://raw.githubusercontent.com/any2cards/worldhaven/refs/heads/master/images/art/frosthaven/icons/loot/fh-lumber-bw-icon.png"
              alt="Drifter"
              loading="lazy"
            />
            <input type="text" name="wood" class="short-input" />
          </label>

          <label>
            <img
              src="https://raw.githubusercontent.com/any2cards/worldhaven/refs/heads/master/images/art/frosthaven/icons/loot/fh-metal-bw-icon.png"
              alt="Drifter"
              loading="lazy"
            />
            <input type="text" name="metal" class="short-input" />
          </label>

          <label>
            <img
              src="https://raw.githubusercontent.com/any2cards/worldhaven/refs/heads/master/images/art/frosthaven/icons/loot/fh-hide-bw-icon.png"
              alt="Drifter"
              loading="lazy"
            />
            <input type="text" name="hide" class="short-input" />
          </label>
        </div>

        <div class="byliny">
          <label>
            <img
              src="https://raw.githubusercontent.com/any2cards/worldhaven/refs/heads/master/images/art/frosthaven/icons/loot/fh-arrowvine-bw-icon.png"
              alt="Drifter"
              loading="lazy"
            />
            <input type="text" name="arrowvine" class="short-input" />
          </label>

          <label>
            <img
              src="https://raw.githubusercontent.com/any2cards/worldhaven/refs/heads/master/images/art/frosthaven/icons/loot/fh-axenut-bw-icon.png"
              alt="Drifter"
              loading="lazy"
            />
            <input type="text" name="axenut" class="short-input" />
          </label>

          <label>
            <img
              src="https://raw.githubusercontent.com/any2cards/worldhaven/refs/heads/master/images/art/frosthaven/icons/loot/fh-corpsecap-bw-icon.png"
              alt="Drifter"
              loading="lazy"
            />
            <input type="text" name="corpsecap" class="short-input" />
          </label>

          <label>
            <img
              src="https://raw.githubusercontent.com/any2cards/worldhaven/refs/heads/master/images/art/frosthaven/icons/loot/fh-flamefruit-bw-icon.png"
              alt="Drifter"
              loading="lazy"
            />
            <input type="text" name="flamefruit" class="short-input" />
          </label>

          <label>
            <img
              src="https://raw.githubusercontent.com/any2cards/worldhaven/refs/heads/master/images/art/frosthaven/icons/loot/fh-rockroot-bw-icon.png"
              alt="Drifter"
              loading="lazy"
            />
            <input type="text" name="rockroot" class="short-input" />
          </label>

          <label>
            <img
              src="https://raw.githubusercontent.com/any2cards/worldhaven/refs/heads/master/images/art/frosthaven/icons/loot/fh-snowthistle-bw-icon.png"
              alt="Drifter"
              loading="lazy"
            />
            <input type="text" name="snowthistle" class="short-input" />
          </label>
        </div>

        <div class="talenty">
          <p>Talenty</p>
          <label>
            <input type="checkbox" id="1" />
            <input type="checkbox" id="2" />
            <input type="checkbox" id="3" />
          </label>

          <label>
            <input type="checkbox" id="4" />
            <input type="checkbox" id="5" />
            <input type="checkbox" id="6" />
          </label>

          <label>
            <input type="checkbox" id="7" />
            <input type="checkbox" id="8" />
            <input type="checkbox" id="9" />
          </label>

          <label>
            <input type="checkbox" id="10" />
            <input type="checkbox" id="11" />
            <input type="checkbox" id="12" />
          </label>

          <label>
            <input type="checkbox" id="13" />
            <input type="checkbox" id="14" />
            <input type="checkbox" id="15" />
          </label>

          <label>
            <input type="checkbox" id="16" />
            <input type="checkbox" id="17" />
            <input type="checkbox" id="18" />
          </label>
        </div>
      </section>
    </div>

    <div class="container">
      <section class="third">
        <input type="checkbox" id="19" />
        <input type="checkbox" id="20" />
        <input type="checkbox" id="21" />
        <label>Nahraď jednu kartu -1 jednou kartou +1.</label>
        <br />
        <input type="checkbox" id="22" />
        <label for="22">Nahraď jednu kartu -2 jednou kartou +0.</label>
        <br />
        <input type="checkbox" id="23" />
        <input type="checkbox" id="24" />
        <label>
          Nahraď jednu kartu +1 dvěma kartami +0 „Posuň jeden ze svých žetonů
          hrdiny o 1 pole zpět.“
        </label>
        <br />
        <input type="checkbox" id="25" />
        <label for="25">
          Nahraď dvě karty +0 dvěma kartami
          <img
            src="https://raw.githubusercontent.com/any2cards/worldhaven/refs/heads/master/images/art/frosthaven/icons/conditions/fh-pierce-bw-icon.png"
            alt="piercing"
            class="icon"
          />
          3
          <img
            src="https://raw.githubusercontent.com/any2cards/worldhaven/refs/heads/master/images/art/frosthaven/icons/general/fh-rolling-bw-icon.png"
            alt="roll"
            class="icon"
          />
          .
        </label>
        <br />
        <input type="checkbox" id="26" />
        <label for="26">Přidej jednu kartu +3.</label>
        <br />
        <input type="checkbox" id="27" />
        <input type="checkbox" id="28" />
        <label>
          Přidej jednu kartu +2
          <img
            src="https://raw.githubusercontent.com/any2cards/worldhaven/refs/heads/master/images/art/frosthaven/icons/conditions/fh-immobilize-bw-icon.png"
            alt="imobilize"
            class="icon"
          />
          .
        </label>
        <br />
        <input type="checkbox" id="29" />
        <label for="29">
          Přidej dvě karty
          <img
            src="https://raw.githubusercontent.com/any2cards/worldhaven/refs/heads/master/images/art/frosthaven/icons/general/fh-heal-bw-icon.png"
            alt="heal"
            class="icon"
          />
          1, sebe
          <img
            src="https://raw.githubusercontent.com/any2cards/worldhaven/refs/heads/master/images/art/frosthaven/icons/general/fh-rolling-bw-icon.png"
            alt="roll"
            class="icon"
          />
          .
        </label>
        <br />
        <input type="checkbox" id="30" />
        <label for="30">Ignoruj efekty scénáře a přidej jednu kartu +1.</label>
        <br />
        <input type="checkbox" id="31" />
        <label for="31">
          Ignoruj -1 efekty předmětů a přidej jednu kartu +1.
        </label>
        <br />
        <input type="checkbox" class="no-gap-right" id="32" />
        <input type="checkbox" class="no-gap-left" id="33" />
        <label>
          Během svého dlouhého odpoč. můžeš posunout jeden svůj žeton hrdiny o 1
          pole zpět.
        </label>
        <br />
        <input type="checkbox" id="34" />
        <label for="34">
          Pro každý scénář se můžeš vybavit 1
          <img
            src="https://raw.githubusercontent.com/any2cards/worldhaven/refs/heads/master/images/art/frosthaven/icons/general/fh-equip-slot-single-hand-bw-icon.png"
            alt="hand"
            class="icon"
          />
          předmětem navíc.
        </label>
        <br />
        <input type="checkbox" id="35" />
        <label for="35">
          Na konci každého scénáře smíš odhodit až dvě karty kořisti, kromě
          náhodných předmětů, a táhnout místo toho stejný počet nových karet
          kořisti.
        </label>
        <br />
      </section>
    </div>

    <script src="js/main.js"></script>
  </body>
</html>
