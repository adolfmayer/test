<!doctype html>
<html>
  <head>
    <title>frostko</title>
    <link rel="stylesheet" href="css/test.css" />
  </head>

  <body>
    <header>
      <a href="test.html">
        <img
          src="https://i.ibb.co/YF3tf1Xn/logo-removebg-preview.png"
          alt="Frostko logo"
          loading="lazy"
        />
      </a>
    </header>

    <div class="container">
      <section class="avatar">
        <img
          src="https://raw.githubusercontent.com/any2cards/worldhaven/refs/heads/master/images/art/frosthaven/characters/images/fh-drifter.png"
          alt="Drifter"
          loading="lazy"
        />
      </section>

      <section>
        <div class="role">
          <label>
            <select name="role" required>
              <option value="Vin Diesel" selected>Vin Diesel</option>
              <option value="Slim Shady">Slim Shady</option>
            </select>
          </label>
        </div>

        <table>
          <tr>
            <td>Level</td>
            <td>1</td>
            <td>2</td>
            <td>3</td>
            <td>4</td>
            <td>5</td>
            <td>6</td>
            <td>7</td>
            <td>8</td>
            <td>9</td>
          </tr>
          <tr>
            <td>XP</td>
            <td>0</td>
            <td>45</td>
            <td>95</td>
            <td>150</td>
            <td>210</td>
            <td>275</td>
            <td>345</td>
            <td>420</td>
            <td>500</td>
          </tr>
        </table>

        <div class="radio-level">
          <label>
            <input type="radio" name="level" value="1" />
          </label>

          <label>
            <input type="radio" name="level" value="2" />
          </label>

          <label>
            <input type="radio" name="level" value="3" />
          </label>

          <label>
            <input type="radio" name="level" value="4" />
          </label>

          <label>
            <input type="radio" name="level" value="5" />
          </label>

          <label>
            <input type="radio" name="level" value="6" />
          </label>

          <label>
            <input type="radio" name="level" value="7" />
          </label>

          <label>
            <input type="radio" name="level" value="8" />
          </label>

          <label>
            <input type="radio" name="level" value="9" />
          </label>
        </div>

        <div class="surky">
          <label>
            <img
              src="https://raw.githubusercontent.com/any2cards/worldhaven/refs/heads/master/images/art/frosthaven/icons/general/fh-xp-bw-icon.png"
              alt="Drifter"
              loading="lazy"
            />
            <input type="text" name="XP" placeholder="XP" class="short-input" />
          </label>
        
          <label>
            <img
              src="https://raw.githubusercontent.com/any2cards/worldhaven/refs/heads/master/images/art/frosthaven/icons/general/fh-money-bw-icon.png"
              alt="Drifter"
              loading="lazy"
            />
            <input type="text" name="$" placeholder="$" class="short-input" />
          </label>
        </div>
      </section>
    </div>

    <script src="js/main.js"></script>
  </body>
</html>
